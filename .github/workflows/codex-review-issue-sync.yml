name: Codex Review Issue Sync

on:
  workflow_run:
    workflows: ['Codex Review Sentinel']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: codex-review-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-codex-review-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar exclusivamente main confiable
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Repetir auditoria de GitHub sin datos no confiables del workflow anterior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_AUDIT_OUTPUT: codex-review-audit.json
        run: python3 scripts/audit_codex_reviews.py
      - name: Crear, actualizar o cerrar Issues de hallazgos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AUDIT_OUTPUT: codex-review-audit.json
        run: python3 scripts/sync_codex_review_issues.py
