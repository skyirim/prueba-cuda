name: NVIDIA SAXPY — 3 ciclos reales AWS GPU

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Para autorizar hasta 3 instancias Spot, escribe EJECUTAR"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-gpu-${{ github.repository }}
  cancel-in-progress: false

jobs:
  saxpy-three-times:
    name: 3 EC2 Spot independientes — SAXPY + logs + borrado
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmacion == 'EJECUTAR' &&
      vars.AWS_CUDA_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      AWS_REGION: ${{ vars.AWS_GPU_REGION || 'us-west-2' }}
      AWS_GPU_S3_BUCKET: ${{ vars.AWS_GPU_S3_BUCKET }}
      AWS_GPU_INSTANCE_PROFILE: ${{ vars.AWS_GPU_INSTANCE_PROFILE }}
      AWS_GPU_SECURITY_GROUP: ${{ vars.AWS_GPU_SECURITY_GROUP }}
      AWS_GPU_VPC_ID: ${{ vars.AWS_GPU_VPC_ID }}
      AWS_GPU_LOG_GROUP: ${{ vars.AWS_GPU_LOG_GROUP }}
      AWS_CUDA_PROBE_ENABLED: ${{ vars.AWS_CUDA_PROBE_ENABLED }}
    steps:
      - name: Descargar fuentes aprobadas de main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Acceder a AWS con token temporal OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_GPU_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: saxpy-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Preparar controlador
        run: |
          python3 -m pip install --disable-pip-version-check 'boto3>=1.41,<2.0'
          git archive --format=tar.gz --output=source.tar.gz "$GITHUB_SHA"
          test -s source.tar.gz
          test -f programs/cuda/saxpy_nvidia.cu

      - name: Ejecutar tres arranques, compilaciones y ejecuciones GPU
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            echo "::group::CICLO $n/3 — nueva instancia EC2 Spot"
            export GPU_TEST_ITERATION="$n"
            python3 -u scripts/aws_gpu_job.py \
              --mode qualify --archive source.tar.gz \
              --spot-ceiling 0.60 --ttl-minutes 30
            echo "::endgroup::"
          done

      - name: Confirmar tres instancias distintas, tres resultados y tres eliminaciones
        run: python3 scripts/ci/verify_three_runs.py --root artifacts/aws-gpu --count 3

      - name: Verificar limpieza de las instancias incluso tras un fallo
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for n in 1 2 3; do
            GPU_TEST_ITERATION="$n" python3 scripts/aws_gpu_job.py --cleanup || status=1
          done
          exit "$status"

      - name: Conservar en GitHub todos los registros originales y resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aws-saxpy-3x-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/aws-gpu/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
