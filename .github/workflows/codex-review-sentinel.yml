name: Codex Review Sentinel

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  commit_comment:
    types: [created]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  audit-codex-reviews:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Estructura valida'
